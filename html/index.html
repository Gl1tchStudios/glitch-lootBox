<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="backdrop"></div>

        <div id="stage">
            <!-- 1. Preview: box art on the left, contents on the right -->
            <section id="view-preview" class="view">
                <div class="pv-wrap">
                    <div class="pv-left">
                        <div id="pv-crumb" class="crumb"></div>
                        <h1 id="pv-name" class="title"></h1>
                        <div id="pv-desc" class="sub"></div>
                        <div class="packbox">
                            <div class="floor"></div>
                            <img id="pv-art" alt="">
                        </div>
                        <dl class="facts">
                            <div><dt data-t="possible">Possible drops</dt><dd id="pv-count">0</dd></div>
                            <div><dt data-t="you_have">You have</dt><dd id="pv-have">0</dd></div>
                            <div><dt id="pv-rare-label">Rarest drop</dt><dd id="pv-rare">-</dd></div>
                        </dl>
                    </div>

                    <div class="pv-right">
                        <div id="pv-odds" class="oddsbar"></div>
                        <div id="pv-key" class="oddskey"></div>
                        <div id="grid" class="grid"></div>
                        <div id="pv-extras" class="extras hidden"></div>
                    </div>
                </div>

                <footer class="bar">
                    <div class="bar-info owned"><img id="pv-mini" alt=""><span id="pv-owned"></span></div>
                    <div class="btns">
                        <button class="btn ghost" data-act="close" data-t="close">Close</button>
                        <button id="btn-unlock" class="btn go"><span data-t="open">Open</span><kbd>SPACE</kbd></button>
                    </div>
                </footer>
            </section>

            <!-- 2. Reel -->
            <section id="view-reel" class="view">
                <header class="head">
                    <div id="rl-crumb" class="crumb" data-t="opening">Opening</div>
                    <h1 id="rl-name" class="title"></h1>
                </header>

                <div class="reel-wrap">
                    <div id="reel" class="reel">
                        <div id="strip" class="strip"></div>
                        <div class="fade l"></div>
                        <div class="fade r"></div>
                    </div>
                    <div class="marker"><i class="tick top"></i><i class="line"></i><i class="tick bot"></i></div>
                </div>

                <div id="rl-hint" class="hint"><kbd>SPACE</kbd><span data-t="skip">Skip</span></div>
            </section>

            <!-- 3. Reveal -->
            <section id="view-reveal" class="view">
                <div class="reveal-fx">
                    <div class="burst"></div>
                    <div class="flash"></div>
                </div>
                <div id="rv-sparks" class="sparks"></div>

                <div class="reveal">
                    <div class="reveal-img">
                        <div class="floor"></div>
                        <img id="rv-img" alt="">
                    </div>
                    <div id="rv-grade" class="reveal-grade"></div>
                    <div id="rv-name" class="reveal-name"></div>
                    <div id="rv-amount" class="reveal-amount"></div>
                </div>
                <div id="rv-extras" class="extras hidden"></div>

                <footer class="bar">
                    <div id="rv-status" class="bar-info"></div>
                    <div class="btns">
                        <button class="btn ghost" data-act="close" data-t="close">Close</button>
                        <button id="btn-again" class="btn go hidden" data-t="open_another">Open another</button>
                    </div>
                </footer>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
